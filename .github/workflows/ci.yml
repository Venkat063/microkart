name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['deploy/envs/*/image-tag.yaml']
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check common services scripts tests --select E9,F63,F7,F82   # real errors only; tighten over time
      - run: python scripts/generate.py && git diff --exit-code
      - run: python -m pytest -q tests/test_store_events.py
      - name: End-to-end smoke test (local bus, SQLite)
        run: |
          python scripts/run_local.py phase1 &
          sleep 8
          python tests/smoke_test.py

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: scripts/ops/validate.sh
      - name: Terraform validate (no backend)
        run: |
          for d in terraform terraform/bootstrap; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - name: Trivy config scan (Dockerfile, Helm, Terraform)
        uses: aquasecurity/trivy-action@0.35.0   # 0.35.0 is the known-safe tag; older unprefixed tags were removed (GHSA-69fq-xp46-6x23)
        with:
          version: v0.69.3                        # known-safe Trivy binary (v0.69.4 was compromised)
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: tests,deploy/local           # deploy/local is the throwaway kind environment

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build every service image (no push)
        run: |
          for s in $(python3 scripts/matrix.py | python3 -c 'import sys,json;print(" ".join(json.load(sys.stdin)["service"]))'); do
            docker buildx build -f docker/Dockerfile --build-arg SERVICE=$s -t microkart/$s:ci --load . &
          done
          wait
