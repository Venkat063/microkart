# main -> build+scan+push images to ECR (tag = 12-char commit sha) -> bump dev's image tag in git -> ArgoCD deploys dev.
name: release
on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**', 'docs/**', '**.md', 'terraform/**']
permissions: {id-token: write, contents: write}
concurrency: {group: release, cancel-in-progress: false}
env:
  AWS_REGION: ap-south-1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - id: m
        run: echo "matrix=$(python scripts/matrix.py)" >> "$GITHUB_OUTPUT"
      - id: t
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # Skipped (not failed) until the AWS ECR role variable exists: see docs/OPS.md section 4.3
    if: ${{ vars.AWS_ECR_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/microkart/${{ matrix.service }}:${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan pushed image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ steps.ecr.outputs.registry }}/microkart/${{ matrix.service }}:${{ needs.plan.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-dev:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin dev to the new images
        run: |
          printf 'image:\n  tag: %s\n' "${{ needs.plan.outputs.tag }}" > deploy/envs/dev/image-tag.yaml
          git config user.name "microkart-ci"
          git config user.email "ci@users.noreply.github.com"
          git add deploy/envs/dev/image-tag.yaml
          git commit -m "deploy(dev): ${{ needs.plan.outputs.tag }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
