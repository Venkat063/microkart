awsRegion: ap-south-1
letsencryptEmail: platform@example.com
kafka:
  version: 3.8.0
  metadataVersion: 3.8-IV0
  replicas: 1
  replicationFactor: 1
  minIsr: 1
  partitions: 3
  storage: {type: ephemeral}            # prod: {type: persistent, size: 100Gi, class: gp3}
  resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 1Gi}}
  topics: [orders, payments, dlq]
  retentionMs: 604800000                # 7 days
jaeger: {enabled: true}
