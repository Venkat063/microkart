{{- if .Values.jaeger.enabled }}
# All-in-one Jaeger with in-memory storage: fine for dev/staging. For prod retention use Tempo or Jaeger+OpenSearch.
apiVersion: apps/v1
kind: Deployment
metadata: {name: jaeger, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env: [{name: COLLECTOR_OTLP_ENABLED, value: "true"}, {name: MEMORY_MAX_TRACES, value: "50000"}]
          ports: [{name: ui, containerPort: 16686}, {name: otlp-http, containerPort: 4318}]
          readinessProbe: {httpGet: {path: /, port: 16686}}
          resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: jaeger-collector, namespace: observability}
spec: {selector: {app: jaeger}, ports: [{name: otlp-http, port: 4318, targetPort: otlp-http}]}
---
apiVersion: v1
kind: Service
metadata: {name: jaeger-query, namespace: observability}
spec: {selector: {app: jaeger}, ports: [{name: ui, port: 16686, targetPort: ui}]}
{{- end }}
