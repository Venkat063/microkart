{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: microkart-db
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ .Values.externalSecrets.storeName }}, kind: ClusterSecretStore}
  target: {name: microkart-db, creationPolicy: Owner}
  data:
    - {secretKey: DB_HOST, remoteRef: {key: {{ .Values.externalSecrets.dbKey }}, property: host}}
    - {secretKey: DB_USER, remoteRef: {key: {{ .Values.externalSecrets.dbKey }}, property: username}}
    - {secretKey: DB_PASSWORD, remoteRef: {key: {{ .Values.externalSecrets.dbKey }}, property: password}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: microkart-app
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ .Values.externalSecrets.storeName }}, kind: ClusterSecretStore}
  target: {name: microkart-app, creationPolicy: Owner}
  data:
    - {secretKey: JWT_SECRET, remoteRef: {key: {{ .Values.externalSecrets.appKey }}, property: JWT_SECRET}}
{{- else if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata: {name: microkart-db}
stringData:
  DB_HOST: {{ .Values.secrets.db.host | quote }}
  DB_USER: {{ .Values.secrets.db.username | quote }}
  DB_PASSWORD: {{ .Values.secrets.db.password | quote }}
---
apiVersion: v1
kind: Secret
metadata: {name: microkart-app}
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
{{- end }}
